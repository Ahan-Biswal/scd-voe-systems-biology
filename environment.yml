name: scd_systems_biology
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - pip
  - r-base>=4.2.0
  - bioconductor-wgcna
  - bioconductor-deseq2
  - bioconductor-clusterprofiler
  - bioconductor-org.hs.eg.db
  - r-pheatmap
  - r-ggplot2
  - r-gridextra
  - r-rcolorbrewer
  - pip:
    - python-docx>=1.1.0
    - matplotlib>=3.7.0
    - pandas>=2.0.0
    - numpy>=1.24.0
    - scipy>=1.10.0
    - seaborn>=0.12.0
